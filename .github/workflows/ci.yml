name: CI

# "My CI blocks deploys that break SEO" (CLAUDE.md §8). Runs on every push to
# main and every pull request; a red run should block the merge.
#
# `pull_request` carries NO `branches:` filter on purpose. That filter matches
# the pull request's BASE, not its head, so `branches: [main]` silently
# excluded every stacked pull request — one opened against another feature
# branch rather than against main. Combined with `push` firing only on main,
# such a pull request fell between the two triggers and ran nothing at all:
# no lint, no unit tests, no SEO regression suite, no Lighthouse budgets.
# It went unnoticed until 2026-09-21, when PR #56 (two new indexable routes,
# an hreflang pair, JSON-LD, two sitemap URLs, and edits to both
# `lighthouserc.js` and three test files) was found with zero runs on it,
# stacked on the redesign branch. Vercel's own commit statuses were green,
# which is what made the absence look like success — a missing check does not
# resemble a failing one. See docs/experiment-log.md, the /design row.
#
# Cost of running on every pull request: intermediate ones in a stack each run
# the full suite, and Lighthouse takes ~10 minutes of wall-clock (five
# parallel shards, below). This repository is public, where GitHub Actions
# minutes are free, so the price is wall-clock and noise rather than money —
# a trade the gate is worth.
on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels the superseded run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      # Coverage thresholds live in vitest.config.ts and are a floor, not a
      # target: the run fails if the covered share of /lib and the API route
      # drops below what was already measured.
      - name: Unit tests + coverage floor
        run: npm run test:coverage

      - name: Production build
        run: npm run build

  # SEO regression suite (CLAUDE.md §8): per route — exactly one h1, title and
  # description within limits, self-referencing canonical, JSON-LD with the
  # expected @type, hreflang consistency. Routes are enumerated from
  # app/sitemap.ts, so new articles are covered automatically.
  seo:
    name: SEO regression (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # SITE_INDEXABLE=true mirrors production: it lets the suite assert that
      # indexable pages carry no noindex (and that /busca still does).
      - name: Production build (indexable)
        run: npm run build
        env:
          SITE_INDEXABLE: 'true'

      - name: SEO regression suite
        run: npm run test:seo
        env:
          SITE_INDEXABLE: 'true'

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Core Web Vitals budgets (CLAUDE.md §6): Performance ≥95, LCP <2.0s,
  # CLS <0.05, TBT <200ms (lab proxy for INP). Budgets live in lighthouserc.js;
  # the build fails if any of them regresses.
  #
  # Pull requests only. On a push to main the merge has already happened and
  # Vercel is already deploying, so a red run there blocks nothing — it only
  # re-measures, on a different runner, a tree its pull request already
  # measured. Timing metrics move with runner CPU (Lighthouse's benchmarkIndex
  # was seen from ~2400 to ~3500 across runs of the same code, halving TBT),
  # so that second opinion was mostly noise: it is what turned the merge of
  # #62 red at TBT 216ms after its pull request had passed at 166ms.
  #
  # Sharded: the URLs are split round-robin across parallel jobs (the split
  # lives in lighthouserc.js). One job ran every URL in series and took ~20
  # minutes; each shard builds on its own and audits three URLs.
  # Shards run on different runners, so compare timings only within a shard's
  # table in the job summary, where the runner's CPU index is printed.
  lighthouse:
    name: Lighthouse CI (shard ${{ matrix.shard }}/5)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      # Every shard reports even when one fails: a red shard alone would hide
      # whether the other templates are also over budget.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The real GTM container (public: it is in every served page), so the
      # third-party cost a visitor pays is inside the budget. lighthouserc.js
      # blocks the GA4 beacons; nothing reaches analytics. Only this job gets
      # the id — the Playwright suite has no reason to load GTM.
      - name: Production build (with GTM)
        run: npm run build
        env:
          NEXT_PUBLIC_GTM_ID: GTM-N5RB56R9

      - name: Lighthouse CI
        run: npm run lhci
        env:
          LHCI_SHARD: ${{ matrix.shard }}
          LHCI_SHARD_TOTAL: 5

      # Also on failure: a red run is exactly when the spread and the runner's
      # CPU index are needed to tell a regression from a slow machine.
      - name: Summary (medians, spread, runner CPU)
        if: always()
        run: node scripts/lhci-summary.mjs

  # One stable check name for the whole matrix (it keeps the name the single
  # job had), so a branch-protection rule never has to list shards.
  lighthouse-gate:
    name: Lighthouse CI budgets
    if: always() && github.event_name == 'pull_request'
    needs: lighthouse
    runs-on: ubuntu-latest
    steps:
      - name: Every shard passed
        run: test "${{ needs.lighthouse.result }}" = success
