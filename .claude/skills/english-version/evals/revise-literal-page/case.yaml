schema_version: "1.1"
name: revise-literal-page
expected_outcome: |
  Given an English page seeded with literal calques, the run executes check-english.mjs first, writes a fact sheet from the Portuguese, redrafts the English from it rather than editing the literal text, then does a native read of the English alone, and removes the flagged and unflagged translationese (colon chains, "it is worth", "that is why", "readings", day-month dates, British spellings, "defects", runs of "the" and sentences opening with "The"), keeps facts, numbers, hedges, links, code, slug, primaryQuery, H2 count and FAQ count unchanged, updates any link to a heading whose anchor changed, does not bump dateModified and says so, and reruns check-english.mjs with 0 errors and register values closer to the native median than before, and check-pair.mjs with 0 errors.
