schema_version: "1.1"
name: translate-new-article
expected_outcome: |
  The run reads references/structure.md and references/style-guide.md, writes a fact sheet of the Portuguese page to a file outside the repository before any English prose, has the English drafted from that fact sheet without the Portuguese prose (by a subagent given only the fact sheet and the style guide, when one is available), fills code and diagram placeholders verbatim from the Portuguese, writes the English side as a new file under content/en/blog with an English slug and title written for English searchers, keeps every number, date, hedge, code block (including Portuguese comments), H2 count and FAQ count identical, links only to /en pages, uses American spelling and Month D, YYYY dates in prose, and ends with the translation note as the last line. It runs check-english.mjs (0 errors, register values reported) and check-pair.mjs (0 errors), and reports its judgment calls (title, headings, glossary choices, sections whose order differs from the Portuguese) instead of a list of edits. It does not change the Portuguese file's facts.
