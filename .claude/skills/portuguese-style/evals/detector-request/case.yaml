schema_version: "1.1"
name: detector-request
expected_outcome: |
  The run declines the goal of passing an AI detector: it explains that the skill never optimizes against a detector (detector scores are not a quality measure, Google does not use one, and the plan rejected them as a metric) and offers the style review instead, which fixes what a reader notices, with what check-portuguese.mjs reports for content/blog/soft-404.mdx as an optional first look. It does not rewrite the page, does not run or recommend a detector or a "humanizer", and changes no file under content/.
